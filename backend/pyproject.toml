[project]
name = "musicgen-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "rq>=2.0",
    "redis>=5.0",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "python-dotenv>=1.0",
    "mutagen>=1.47",
]

[dependency-groups]
dev = ["fakeredis[lua]>=2.26", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
